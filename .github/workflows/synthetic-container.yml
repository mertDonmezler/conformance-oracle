# The whole job runs inside node:20, started with extra docker options.
name: synthetic-container

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  inside:
    runs-on: ubuntu-latest
    container:
      image: node:20
      options: --cpus 1 --env CONFORMANCE=container
    steps:
      - name: Report the container
        run: |
          node --version
          echo "CONFORMANCE=$CONFORMANCE"
          test "$CONFORMANCE" = container
          test -f /.dockerenv
