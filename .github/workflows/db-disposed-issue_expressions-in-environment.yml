# Registers corpus/db-disposed-issue_expressions-in-environment for workflow_dispatch. A run uses the file on
# branch corpus/db-disposed-issue_expressions-in-environment, never this one; see the bant-conformance README.
name: db-disposed-issue_expressions-in-environment
on: workflow_dispatch
jobs:
  registered:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dispatch with --ref corpus/db-disposed-issue_expressions-in-environment"
