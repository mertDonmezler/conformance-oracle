# A job with read-only permissions calls the API with GITHUB_TOKEN. The
# token is never printed; only fields of the public repository are.
name: synthetic-permissions-token

on: [push, workflow_dispatch]

permissions: {}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Read the repository through the API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '.full_name + " " + .visibility'
