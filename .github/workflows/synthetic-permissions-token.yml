# Registers corpus/synthetic-permissions-token for workflow_dispatch. A run uses the file on
# branch corpus/synthetic-permissions-token, never this one; see the bant-conformance README.
name: synthetic-permissions-token
on: workflow_dispatch
jobs:
  registered:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dispatch with --ref corpus/synthetic-permissions-token"
