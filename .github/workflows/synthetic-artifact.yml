# A file uploaded as an artifact by one job and downloaded by the next.
name: synthetic-artifact

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Write the file
        run: |
          mkdir out
          echo "conformance artifact" > out/payload.txt
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: payload
          path: out/payload.txt

  download:
    runs-on: ubuntu-latest
    needs: upload
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: payload
      - name: Read the file
        run: |
          cat payload.txt
          test "$(cat payload.txt)" = "conformance artifact"
