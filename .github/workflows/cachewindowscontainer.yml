# Registers corpus/cachewindowscontainer for workflow_dispatch. A run uses the file on
# branch corpus/cachewindowscontainer, never this one; see the bant-conformance README.
name: cachewindowscontainer
on: workflow_dispatch
jobs:
  registered:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dispatch with --ref corpus/cachewindowscontainer"
