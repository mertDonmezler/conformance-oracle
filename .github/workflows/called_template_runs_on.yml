# Registers corpus/called_template_runs_on for workflow_dispatch. A run uses the file on
# branch corpus/called_template_runs_on, never this one; see the bant-conformance README.
name: called_template_runs_on
on: workflow_dispatch
jobs:
  registered:
    runs-on: ubuntu-latest
    steps:
      - run: echo "dispatch with --ref corpus/called_template_runs_on"
