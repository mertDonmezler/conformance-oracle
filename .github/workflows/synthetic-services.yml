# A postgres service container that the job waits for through its health
# check, then reaches on the mapped port.
name: synthetic-services

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: conformance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Query the service
        env:
          PGPASSWORD: conformance
        run: psql -h localhost -U postgres -c "select 1 as ready"
