# Which steps run after a failure: a step that fails but is allowed to,
# then a step that fails for real, then the success(), failure() and
# always() steps that follow it. The job fails, as it should.
name: synthetic-conditions

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Allowed to fail
        continue-on-error: true
        run: exit 3

      - name: Runs because the failure above was allowed
        run: echo "still going"

      - name: Fails the job
        run: exit 1

      - name: Skipped after a failure
        if: success()
        run: echo "not printed"

      - name: Runs on failure
        if: failure()
        run: echo "a step failed"

      - name: Runs always
        if: always()
        timeout-minutes: 1
        run: echo "always runs"
