# One step per shell, all run in a default working directory.
name: synthetic-shells

on: [push, workflow_dispatch]

permissions:
  contents: read

defaults:
  run:
    working-directory: /tmp

jobs:
  shells:
    runs-on: ubuntu-latest
    steps:
      - name: bash
        shell: bash
        run: echo "bash in $(pwd) with ${BASH_VERSINFO[0]}"

      - name: sh
        shell: sh
        run: echo "sh in $(pwd)"

      - name: python
        shell: python
        run: |
          import os
          print("python in", os.getcwd())

      - name: pwsh
        shell: pwsh
        run: Write-Output "pwsh in $(Get-Location)"
