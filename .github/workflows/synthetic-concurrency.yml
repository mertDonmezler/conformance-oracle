# A run in a named concurrency group, with a job in a group of its own.
name: synthetic-concurrency

on: [push, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: synthetic-concurrency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serial:
    runs-on: ubuntu-latest
    concurrency:
      group: synthetic-concurrency-job-${{ github.ref }}
    steps:
      - name: Run in the group
        run: echo "in group synthetic-concurrency-${{ github.ref }}"
